<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактор сценария</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-vn-context="editor">
  <div class="editor-page">
    <div class="editor-toolbar" data-vn-slot="editor.toolbar">
      <button id="btn-example">Вставить пример</button>
      <button id="btn-clear">Очистить</button>
      <span class="hint">Пиши обычным текстом • изменения сразу видны справа</span>
    </div>
    <textarea id="script-editor" spellcheck="false"></textarea>
  </div>

  <script src="js/plugin-sdk.js"></script>
  <script>
    VN.plugins.loadInstalled().catch(err => console.error('[VN plugins]', err));

    const DEFAULT_SCRIPT = `# Начало
фон парк
показать Алиса счастливая слева

Алиса: Привет! Добро пожаловать в мою историю.

выбор:
  - Хочу узнать больше → больше
  - Мне нужно идти → прощание

# больше
показать Алиса серьёзная слева
Алиса: Я живу в этом городе уже много лет.
Алиса: Здесь происходят странные вещи...
тряска 14 0.6
Алиса: Ты это тоже почувствовал?
перейти прощание

# прощание
показать Алиса счастливая слева
Алиса: Ладно, ещё увидимся!
ждать 0.5
конец`;

    const editor = document.getElementById('script-editor');
    let debounceTimer = null;

    function notify() {
      const text = editor.value;
      try {
        localStorage.setItem('vn_script', text);
      } catch (e) {}
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'script-updated', text }, '*');
      }
    }

    editor.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(notify, 200);
    });

    document.getElementById('btn-example').addEventListener('click', () => {
      editor.value = DEFAULT_SCRIPT;
      notify();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      editor.value = '';
      notify();
    });

    // Загрузка: сохранённый скрипт или пример по умолчанию
    let saved = null;
    try { saved = localStorage.getItem('vn_script'); } catch (e) {}
    if (saved && saved.trim()) {
      editor.value = saved;
    } else {
      editor.value = DEFAULT_SCRIPT;
    }

    // Сразу и ещё раз через паузу — чтобы iframe плеера успел подписаться
    notify();
    setTimeout(notify, 400);
    setTimeout(notify, 1000);

    // Родитель может запросить актуальный текст
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'request-script') {
        notify();
      }
    });

    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        notify();
      }
    });
  </script>
</body>
</html>
