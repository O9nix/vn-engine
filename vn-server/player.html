<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Плеер</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; margin: 0; }
    .player-page {
      height: 100%;
      width: 100%;
      display: flex;
      background: #0a0a12;
    }
    .player-page { position: relative; }
    .vn-player-plugin-top, .vn-player-plugin-bottom { position: absolute; z-index: 50; left: 0; right: 0; pointer-events: none; display: flex; gap: 8px; padding: 8px; }
    .vn-player-plugin-top { top: 0; justify-content: flex-end; }
    .vn-player-plugin-bottom { bottom: 0; justify-content: center; }
    .vn-player-plugin-top > *, .vn-player-plugin-bottom > * { pointer-events: auto; }
    #game {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    #game .vn-stage {
      width: 100%;
      height: 100%;
      max-width: none;
      aspect-ratio: auto;
    }
    .vn-waiting {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      font-size: 1rem;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body data-vn-context="player">
  <div class="player-page">
    <div class="vn-plugin-slot vn-player-plugin-top" data-vn-slot="player.top"></div>
    <div class="vn-plugin-slot vn-player-plugin-bottom" data-vn-slot="player.bottom"></div>
    <div id="game">
      <div class="vn-waiting">Ожидание сценария…<br>
        <small>Напиши текст слева или нажми «Вставить пример»</small>
      </div>
    </div>
  </div>

  <!-- SDK → parser → host → расширения → core → ui -->
  <script src="js/plugin-sdk.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/extensions-host.js"></script>
  <script src="extensions/camera-shake/extension.js"></script>
  <script src="extensions/wait/extension.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let vn = null;
    let lastText = '';
    const pluginsReady = VN.plugins.loadInstalled();

    function ensureVN() {
      if (vn) return vn;
      document.getElementById('game').innerHTML = '';
      // createVN сам создаёт core; расширения подхватываются в конструкторе VNCore
      vn = createVN('#game', {
        typingSpeed: 25,
        assetsPath: 'assets/'
      });
      // на случай, если расширения подключили после core
      if (window.VN && VN.applyExtensionsToCore) {
        VN.applyExtensionsToCore(vn);
      }
      return vn;
    }

    async function loadScript(text) {
      if (!text || !String(text).trim()) return;
      if (text === lastText) return;
      try {
        await pluginsReady;
        lastText = text;
        ensureVN().load(text);
      } catch (err) {
        console.error('Ошибка загрузки сценария:', err);
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'vn_script') loadScript(e.newValue);
    });

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'script-updated') loadScript(e.data.text);
      if (e.data.type === 'reload-script') {
        try { loadScript(localStorage.getItem('vn_script')); } catch (err) {}
      }
    });

    try {
      const initial = localStorage.getItem('vn_script');
      if (initial) loadScript(initial);
    } catch (e) {}

    if (window.parent !== window) {
      window.parent.postMessage({ type: 'request-script' }, '*');
    }
    setTimeout(() => {
      try {
        const t = localStorage.getItem('vn_script');
        if (t) loadScript(t);
      } catch (e) {}
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'request-script' }, '*');
      }
    }, 500);
  </script>
</body>
</html>
