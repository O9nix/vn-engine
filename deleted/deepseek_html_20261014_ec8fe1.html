function parseScript(source) {
  const ast = { scenes: [] };
  // Регулярка: начало строки, любые пробелы, #, один+ пробел, затем название сцены
  const sceneRegex = /^\s*#\s+(.*)$/;

  const lines = source.split('\n');
  let currentScene = null; // Здесь храним сцену, которая сейчас «открыта»

  lines.forEach((line, index) => {
    // Пропускаем полностью пустые строки
    if (!line.trim()) return;

    const match = line.match(sceneRegex);

    if (match) {
      // Нашли заголовок сцены
      
      // Если была предыдущая сцена — сохраняем её в AST
      if (currentScene) {
        ast.scenes.push(currentScene);
      }

      // Создаём новую сцену
      currentScene = {
        id: `scene_${index}`,
        name: match[1].trim(), // Название сцены из регулярки
        nodes: []              // Пустой список узлов
      };
      return; // Строка с заголовком не является узлом, пропускаем дальше
    }

    // Если ещё не было ни одной сцены — пропускаем строки до первого #
    if (!currentScene) return;

    // Создаём НОВЫЙ объект узла для каждой строки
    const node = {
      id: `node_${currentScene.nodes.length}`,
      type: 'text',
      text: line.trim(),
      character: null
    };

    // Простая проверка: если строка вида [персонаж] текст
    const speakerMatch = /^\[([^\]]+)\]\s*(.*)$/.exec(line);
    if (speakerMatch) {
      node.character = speakerMatch[1];
      node.text = speakerMatch[2].trim();
    }

    // Добавляем узел в текущую сцену
    currentScene.nodes.push(node);
  });

  // Если в конце осталась открытая сцена — добавляем её
  if (currentScene) {
    ast.scenes.push(currentScene);
  }

  return ast;
}


            // ============================================================
            // ИНТЕРФЕЙС

            const input = document.getElementById('script-input');
            const output = document.getElementById('json-output');
            const parseStatus = document.getElementById('parse-status');
            const jsonStatus = document.getElementById('json-status');

            let debounceTimer = null;

            // Подсветка JSON
            function syntaxHighlight(json) {
                if (typeof json !== 'string') {
                    json = JSON.stringify(json, null, 2);
                }
                json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return json.replace(
                    /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                    function(match) {
                        let cls = 'json-number';
                        if (/^"/.test(match)) {
                            if (/:$/.test(match)) {
                                cls = 'json-key';
                            } else {
                                cls = 'json-string';
                            }
                        } else if (/true|false/.test(match)) {
                            cls = 'json-boolean';
                        } else if (/null/.test(match)) {
                            cls = 'json-null';
                        }
                        return '<span class="' + cls + '">' + match + '</span>';
                    }
                );
            }

            // Основная функция обновления
            function update() {
                const source = input.value;

                if (source.trim() === '') {
                    output.innerHTML = '<span style="color:#4a4a6a">// Введите сценарий слева...</span>';
                    parseStatus.textContent = 'ожидание';
                    parseStatus.className = 'status';
                    jsonStatus.textContent = '—';
                    return;
                }

                try {
                    const ast = parseScript(source);
                    const json = JSON.stringify(ast, null, 2);

                    output.innerHTML = syntaxHighlight(json);

                    const nodeCount = (ast.scenes || []).reduce(
                        (sum, s) => sum + (s.nodes ? s.nodes.length : 0), 0
                    );

                    parseStatus.textContent = '✓ OK';
                    parseStatus.className = 'status success';

                    jsonStatus.textContent = (ast.scenes ? ast.scenes.length : 0) +
                        ' сцен, ' + nodeCount + ' узлов';
                } catch (e) {
                    output.innerHTML = '<span style="color:#ff6b6b">// Ошибка парсинга:\n// ' +
                        e.message.replace(/</g, '&lt;') + '</span>';
                    parseStatus.textContent = '✕ Ошибка';
                    parseStatus.className = 'status error';
                    jsonStatus.textContent = 'ошибка';
                }
            }

            // Debounce
            function scheduleUpdate() {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(update, 200);
            }

            // Слушатели
            input.addEventListener('input', scheduleUpdate);

            document.getElementById('btn-parse').addEventListener('click', update);

            document.getElementById('btn-clear').addEventListener('click', function() {
                input.value = '';
                update();
                input.focus();
            });

            document.getElementById('btn-copy').addEventListener('click', function() {
                const text = output.textContent;
                navigator.clipboard.writeText(text).then(function() {
                    const btn = document.getElementById('btn-copy');
                    const original = btn.textContent;
                    btn.textContent = '✓ Скопировано';
                    setTimeout(function() { btn.textContent = original; }, 1200);
                });
            });

            // Перетаскивание разделителя
            (function() {
                const divider = document.getElementById('divider');
                const leftPanel = document.getElementById('left-panel');
                const rightPanel = document.getElementById('right-panel');
                const container = document.getElementById('container');
                let isDragging = false;

                divider.addEventListener('mousedown', function(e) {
                    isDragging = true;
                    divider.style.background = '#5a5a8a';
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', function(e) {
                    if (!isDragging) return;
                    const rect = container.getBoundingClientRect();
                    const totalWidth = rect.width;
                    const offsetX = e.clientX - rect.left;
                    const minPanel = 200;
                    const leftWidth = Math.max(minPanel, Math.min(totalWidth - minPanel, offsetX));
                    const rightWidth = totalWidth - leftWidth;

                    leftPanel.style.flex = '0 0 ' + leftWidth + 'px';
                    rightPanel.style.flex = '0 0 ' + rightWidth + 'px';
                });

                document.addEventListener('mouseup', function() {
                    if (isDragging) {
                        isDragging = false;
                        divider.style.background = '';
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                    }
                });
            })();

            // Первичный парсинг
            update();

            // Экспорт parseScript в глобальную область, чтобы можно было
            // тестировать в консоли: parseScript(input.value)
            window.parseScript = parseScript;
            window.getAST = function() {
                return parseScript(input.value);
            };
