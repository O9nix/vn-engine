<!doctype html><html lang="ru"><meta charset="utf-8"><title>VN Extension Hub</title><style>body{font-family:system-ui;background:#0f0f1a;color:#eee;max-width:1000px;margin:40px auto;padding:20px}.card{background:#19192b;border:1px solid #30304d;border-radius:10px;padding:15px;margin:10px 0}code{color:#9cdcfe}</style><h1>VN Extension Hub</h1><p>Каталог расширений, документация SDK и API движка.</p><div id="list">Загрузка…</div><script>fetch('/api/plugins').then(r=>r.json()).then(a=>{list.innerHTML=a.length?a.map(x=>`<div class="card"><b>${x.name}</b> <code>v${x.version}</code><p>${x.description||''}</p><small>${x.id}</small></div>`).join(''):'<div class="card">Пока нет расширений.</div>'})</script>
