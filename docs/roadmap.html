  <script>
    (function () {
      'use strict';
      var D = JSON.parse(document.getElementById('roadmap-data').textContent);
      var T = D.T;
      var STEPS = D.steps;
      var timeline = document.getElementById('timeline');
      var detail = document.getElementById('detail');
      timeline.setAttribute('aria-label', T.aria);

      /* ---------- DOM-помощники (без innerHTML) ---------- */
      function add(e, c) {
        if (c == null || c === false) return;
        if (Array.isArray(c)) c.forEach(function (x) { add(e, x); });
        else e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
      }
      function h(tag, attrs) {
        var e = document.createElement(tag);
        if (attrs) Object.keys(attrs).forEach(function (k) {
          var v = attrs[k];
          if (v == null || v === false) return;
          if (k === 'class') e.className = v;
          else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v === true ? '' : v);
        });
        for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
        return e;
      }

      // `код`, **жирный**, [текст](ссылка); ссылки только http(s), mailto, относительные и #
      function inline(s) {
        var re = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\([^)\s]+\))/;
        return String(s).split(re).map(function (x) {
          var m;
          if (/^`[^`]+`$/.test(x)) return h('code', null, x.slice(1, -1));
          if (/^\*\*[^*]+\*\*$/.test(x)) return h('strong', null, x.slice(2, -2));
          m = x.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/);
          if (m && /^(https?:|mailto:|#|\.{0,2}\/)/i.test(m[2])) return h('a', { href: m[2], rel: 'noopener' }, m[1]);
          return x;
        });
      }

      function byHash() {
        var v = decodeURIComponent(location.hash.replace(/^#/, ''));
        for (var i = 0; i < STEPS.length; i++) if (STEPS[i].version === v) return i;
        return -1;
      }

      function initialIndex() {
        var i = byHash();
        if (i >= 0) return i;
        for (i = 0; i < STEPS.length; i++) if (STEPS[i].status === 'current') return i;
        return 0;
      }

      var active = initialIndex();

      /* ---------- шапка ---------- */
      document.getElementById('h-title').textContent = D.title;
      document.getElementById('h-sub').textContent = D.subtitle;
      var ver = document.getElementById('h-ver');
      ver.textContent = (D.current ? T.current + ': ' + D.current : T.unknown) + (D.versionFile ? ' · ' + D.versionFile : '');

      /* ---------- этапы ---------- */
      function statusClass(s) { return s === 'current' ? 'current' : s === 'done' ? 'done' : ''; }
      function statusBadge(s) {
        if (s === 'current') return h('span', { class: 'badge current' }, T.nowBadge);
        if (s === 'done') return h('span', { class: 'badge done' }, T.doneBadge);
        return null;
      }

      function renderTimeline() {
        timeline.textContent = '';
        STEPS.forEach(function (step, i) {
          timeline.appendChild(h('button', {
            type: 'button',
            class: 'item ' + statusClass(step.status) + (i === active ? ' active' : ''),
            onclick: function () { select(i); }
          },
            h('span', { class: 'dot', 'aria-hidden': 'true' }),
            h('span', { class: 'item-inner' },
              h('span', { class: 'ver-label' }, step.version),
              h('span', { class: 'title' }, step.title))));
        });
      }

      function renderItem(it) {
        return h('li', null, inline(it.text), (it.sub || []).map(function (s) {
          return h('div', { class: 'sub' }, inline(s));
        }));
      }

      function renderDetail() {

          return;
        }
        add(detail, h('h2', null, inline(step.title), statusBadge(step.status)));
        add(detail, h('p', { class: 'meta' }, T.version + ' ', h('span', null, step.version)));
        if (step.lead) add(detail, h('p', { class: 'lead' }, inline(step.lead)));

        step.sections.forEach(function (sec) {
          add(detail, h('h3', null, sec.label || T.includes));
          add(detail, h('ul', null, sec.items.map(renderItem)));
        });
        step.sketches.forEach(function (sk) {
          add(detail, h('h3', null, sk.title || T.scheme));
          add(detail, h('div', { class: 'layout-sketch' }, sk.text));
        });
        step.notes.forEach(function (n) { add(detail, h('p', { class: 'lead', style: 'margin-top:14px' }, inline(n))); });
        if (step.result) add(detail, h('div', { class: 'result' }, inline(step.result)));

        if (D.sourceName) {
          add(detail, h('p', { class: 'hint' }, T.source + ': ', h('code', null, D.sourceName), '. ' + T.hint));
        }
      }

      function select(i) {
        active = i;
        try { history.replaceState(null, '', '#' + encodeURIComponent(STEPS[i].version)); } catch (e) {}
        renderTimeline();
        renderDetail();
        var a = timeline.querySelector('.item.active');
        if (a && a.scrollIntoView && window.matchMedia && !window.matchMedia('(max-width: 720px)').matches) {
          a.scrollIntoView({ block: 'nearest' });
        }
      }

      window.addEventListener('hashchange', function () {
        var i = byHash();
        if (i >= 0 && i !== active) { active = i; renderTimeline(); renderDetail(); }
      });

      renderTimeline();
      renderDetail();
    })();
  </script>
</body>
</html>
