* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.layout { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--border);
  padding: 16px 12px 24px;
}
.brand { font-size: 17px; font-weight: 700; margin: 0 4px 12px; }
.side select, .side input {

  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font: inherit;
}
.nav a.item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 6px; color: var(--text);
}
.nav a.item:hover { background: var(--code-bg); text-decoration: none; }
.nav a.item.active { background: var(--accent); color: #fff; }
.nav a.item.active .method { background: rgba(255,255,255,.22); color: #fff; }
.nav .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .label.dep { text-decoration: line-through; opacity: .7; }
.nav details { margin-top: 6px; }
.nav summary {
  cursor: pointer; padding: 6px 8px; font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
}
.nav .top { margin-bottom: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.add { background: var(--add); }
.dot.chg { background: var(--chg); }

.method {
  display: inline-block; min-width: 52px; text-align: center;
  font: 700 10.5px/1 ui-monospace, Menlo, Consolas, monospace;
  padding: 4px 6px; border-radius: 4px; color: #fff; flex: none; background: var(--other);

.m-GET { background: var(--get); }
.m-POST { background: var(--post); }
.m-PUT { background: var(--put); }
.m-PATCH { background: var(--patch); }
.m-DELETE { background: var(--delete); }

.main h1 { margin: 0 0 6px; font-size: 26px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.tag {
  display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px;

.tag.req { color: var(--rem); }

table.fields { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }

  text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--border);

.rich p { margin: 0 0 10px; }
.rich ul { margin: 0 0 10px; padding-left: 20px; }
.cell.rich p:last-child { margin-bottom: 0; }

.example { margin: 10px 0 14px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.ex-head {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--panel); font-size: 12px; color: var(--muted);
}
.ex-head .grow { flex: 1; }
.example pre { margin: 0; padding: 12px 14px; background: var(--pre-bg); color: var(--pre-text); overflow-x: auto; }
.example pre code { background: none; padding: 0; color: inherit; }
button.copy {
  font: inherit; font-size: 12px; padding: 2px 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 5px;
}

.changes ul { margin: 4px 0 12px; padding-left: 20px; }
.changes .add { color: var(--add); }
.changes .chg { color: var(--chg); }
.changes .rem { color: var(--rem); }
.changes h3 { margin: 10px 0 2px; }
.card {
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--panel); margin-bottom: 14px;
}
.vlist { display: flex; flex-wrap: wrap; gap: 6px; }
.vlist a { padding: 2px 8px; border: 1px solid var(--border); border-radius: 10px; font-size: 12px; }
.vlist a.cur { background: var(--accent); color: #fff; border-color: var(--accent); }
.source { margin-top: 28px; font-size: 12px; color: var(--muted); }

.topbar { display: none; }
@media (max-width: 900px) {
  .layout { display: block; }
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .topbar button { font: inherit; padding: 4px 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; }
  .side { display: none; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  body.nav-open .side { display: block; }
  .main { padding: 20px 16px 60px; }

я исключением:\nс таким проектом работать нельзя.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"Project","name":"project","optional":false,"description":"Проект с объявленными плагинами."},{"group":null,"type":"PluginRegistry","name":"registry","optional":false,"description":"Каталог доступных плагинов."},{"group":null,"type":"PluginManager","name":"manager","optional":false,"description":"Менеджер, устанавливающий плагины."}]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"const report = await loadProjectPlugins(project, registry, plugins);\nif (report.failed.length === 0) {\n    game.loadProject(project);\n}"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-loader.js","line":143},"returns":{"type":"Promise","description":"Промис с отчётом `{ installed, failed }`:\n`installed` — имена установленных плагинов в порядке установки,\n`failed` — массив объектов `{ name, stage, message, error }`,\nгде `stage` — `load`, `install` или `dependency`."},"throws":[{"type":"Error","description":"Если описание плагинов в проекте некорректно."}],"sig":"(project, registry, manager)","doc":true},{"key":"PluginManager","method":"CLASS","path":"PluginManager","title":"PluginManager","group":"PluginManager","description":"Устанавливает плагины и выдаёт каждому из них собственный Plugin API\n(`plugin`, `log`, `events`, `game`, `player`, `blocks`, `ast`, `validation`, `plugins`).\n\nВсё, что плагин занял через свой `api` (подписки на события, слои,\nтипы узлов, блоки, команды парсера, проверки валидатора), движок снимает сам при удалении\nплагина или при сбое его установки.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"const plugins = new PluginManager(bus, game, player, blocks, ast, validator);\n\nplugins.use(StatePlugin);\nplugins.has('state');   // true\nplugins.list();         // ['state']\nplugins.remove('state');"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-manager.js","line":29},"doc":true},{"key":"PluginManager.constructor","method":"METHOD","path":"PluginManager.constructor","title":"PluginManager.constructor(bus, game, player, blocks, ast, validator)","group":"PluginManager","description":"Запоминает зависимости движка. Для каждого плагина при установке\nсоздаётся собственный `api`, который передаётся в `install(api)`.\n\nСтруктура api:\n```\napi\n├── plugin\n│   └── name                → имя этого плагина\n├── log\n│   ├── info(...args)\n│   ├── warn(...args)\n│   └── error(...args)\n├── events\n│   ├── on(event, handler) → unsubscribe\n│   └── emit(event, payload)\n├── game\n│   ├── getPluginLayer() → HTMLElement\n│   ├── registerLayer(name, element) → cleanup\n│   ├── registerNodeType(type, handler)\n│   ├── show(name)\n│   ├── hide(name)\n│   └── isVisible(name) → boolean\n├── player\n│   ├── getPluginLayer() → HTMLElement\n│   ├── registerLayer(name, element) → cleanup\n│   ├── show(name)\n│   ├── hide(name)\n│   └── isVisible(name) → boolean\n├── blocks                  → BlockManager\n├── ast\n│   └── addCommand(pattern, nodeType, handler)\n├── validation\n│   ├── register(check) → unregister\n│   └── registerNodeRule(nodeType, rule) → unregister\n└── plugins                 → Proxy\n    └── \u003cname>.api          → публичный API плагина\n```","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"EventBus","name":"bus","optional":false,"description":"Шина событий."},{"group":null,"type":"VN","name":"game","optional":false,"description":"Ядро: выполняет узлы истории."},{"group":null,"type":"Player","name":"player","optional":false,"description":"Плеер со слоями страницы."},{"group":null,"type":"BlockManager","name":"blocks","optional":false,"description":"Менеджер визуальн  снимаются при его удалении.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"api.ast.addCommand(/^!(.*)$/, 'shout', (match) => ({\n    type: 'shout',\n    text: match[1].trim()\n}));"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-manager.js","line":498},"doc":true},{"key":"api.ast.addCommand","method":"METHOD","path":"api.ast.addCommand","title":"api.ast.addCommand(pattern, nodeType, handler)","group":"PluginAPI","description":"Регистрирует текстовую команду парсера.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"RegExp","name":"pattern","optional":false,"description":"Регулярное выражение для строки сценария."},{"group":null,"type":"string","name":"nodeType","optional":false,"description":"Тип узла, который создаёт команда."},{"group":null,"type":"function","name":"handler","optional":false,"description":"(match, line, index, scene) => узел"}]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"api.ast.addCommand(/^\\/\\/\\s*(.*)$/, 'narration', (match, line, index) => ({\n    type: 'narration',\n    text: match[1].trim()\n}));"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-manager.js","line":511},"throws":[{"type":"Error","description":"Если PluginManager создан без парсера\nили такая команда уже зарегистрирована."}],"sig":"(pattern, nodeType, handler)","doc":true},{"key":"api.validation","method":"PROP","path":"api.validation","title":"api.validation","group":"PluginAPI","description":"Доступ к валидатору проекта: плагин добавляет собственные проверки.\nПроверки плагина снимаются при его удалении, а их id получают\nпрефикс `имя-плагина:`.\n\nЕсть два вида проверок: `register` смотрит на проект целиком,\n`registerNodeRule` вызывается для каждого узла своего типа.\nЗапись `{ code, message, path }` описывает одну проблему.\nОшибка (`error`) не даёт запустить историю, предупреждение\n(`warning`) только показывается игроку и разработчику.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"install(api) {\n    // Проверка узлов типа take\n    api.validation.registerNodeRule('take', {\n        id: 'item',\n        run(node) {\n            return node.item\n                ? []\n                : [{ code: 'take.no-item', message: 'У узла take нет item' }];\n        }\n    });\n\n    // Проверка проекта целиком, только предупреждение\n    api.validation.register({\n        id: 'items-config',\n        severity: 'warning',\n        run(project) {\n            const items = project.getConfig().items;\n            return items\n                ? []\n                : [{ code: 'inventory.no-items', message: 'В config нет items' }];\n        }\n    });\n}"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-manager.js","line":540},"doc":true},{"key":"api.validation.register","method":"METHOD","path":"api.validation.register","title":"api.validation.register(check)","group":"PluginAPI","description":"Регистрирует проверку всего проекта.\n\nФункция `run(project, context)` возвращает массив записей\n(пустой массив значит «всё хорошо»). В записи можно указать\n`code`, `message`, `path` и `severity`; имя плагина валидатор\nподставит сам. `context.plugins` содержит манифесты\nустановленных плагинов.\n\nПроверка выполняется до запуска истории, поэтому читать нужно\nданные проекта (`project.getConfig()`, `project.getScenes()`),\nа не runtime-состояние плагинов: оно ещё пустое.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"Object","name":"check","optional":false,"description":"Проверка: `id`, `run(project, context)`,\nнеобязательные `severity` (error или warning, по умолчанию error)\nи `timeout` в миллисекундах (по умолчанию 3000)."}]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"api.validation.register({\n    id: 'unknown-variables',\n    severity: 'warning',\n    run(project) {\n        const known = project.getConfig().state ?? {};\n        const found = [];\n\n        for (const scene of project.getScenes()) {\n            for (const node of scene.nodes ?? []) {\n                if (node.variable && !(node.variable in known)) {\n                    found.push({\n                        code: 'my.unknown-variable',\n                        message: `Переменной \"${node.variable}\" нет в config.state`,\n                        path: `узел \"${node.id}\"`\n                    });\n                }\n            }\n        }\n\n        return found;\n    }\n});"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-manager.js","line":578},"returns":{"type":"function","description":"Функция, снимающая проверку."},"throws":[{"type":"Error","description":"Если PluginManager создан без валидатора."}],"sig":"(check)","doc":true},{"key":"api.validation.registerNodeRule","method":"METHOD","path":"api.validation.registerNodeRule","title":"api.validation.registerNodeRule(nodeType, rule)","group":"PluginAPI","description":"Регистрирует правило для узлов одного типа: валидатор сам\nобходит проект и вызывает `run(node, context)`.\n\nПуть к узлу (`scenes[0].nodes[2]`) подставляется в запись сам,\nесли плагин не указал свой `path`. Возвращать нужно массив\nзаписей; пустой массив значит «узел в порядке».","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"string","name":"nodeType","optional":false,"description":"Тип узла."},{"group":null,"type":"Object","name":"rule","optional":false,"description":"Правило: те же поля, что у register()."}]},"success":[],"error":[],"examples":[{"type":"","title":"","con y":"PluginRegistry","method":"CLASS","path":"PluginRegistry","title":"PluginRegistry","group":"PluginRegistry","description":"Каталог доступных плагинов: по имени отдаёт объект плагина.\n\nПлагин можно добавить вручную (`register()`) или дать каталогу\nзагрузчик (`loader`), который получает плагин по имени. Интерфейс\n`resolve()` асинхронный, поэтому загрузчик может быть как\nлокальным, так и обращаться к внешнему сервису: остальной код\nдвижка об этом не знает.\n\nИмя плагина должно состоять из строчных латинских букв, цифр\nи дефисов (`choice`, `top-left-hud`). Это проверяется до вызова\nзагрузчика, потому что имя приходит из данных проекта.\n\nМинимальный манифест плагина:\n```\n{\n    name: 'choice',                        // обязательно, уникальное имя\n    version: '0.1.0',                      // версия плагина\n    dependencies: ['state', 'conditions'], // имена нужных плагинов\n    nodeTypes: ['choice'],                 // типы узлов, которые даёт плагин\n    install(api) { ... }                   // обязательно\n}\n```","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"const registry = new PluginRegistry({ loader: localPluginLoader });\n\nregistry.register({ name: 'hello', install() {} });\nconst plugin = await registry.resolve('choice');"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-registry.js","line":3},"doc":true},{"key":"PluginRegistry.constructor","method":"METHOD","path":"PluginRegistry.constructor","title":"PluginRegistry.constructor(options)","group":"PluginRegistry","description":"Создаёт каталог.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"Object","name":"options","optional":true,"description":"Параметры каталога."},{"group":null,"type":"function","name":"options.loader","optional":true,"description":"Загрузчик `(name) => Promise`: по имени плагина возвращает\nпромис с его объектом. Вызывается,\nтолько если плагина нет среди добавленных вручную или уже\nзагруженных. Результат запоминается."}]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"const registry = new PluginRegistry({ loader: localPluginLoader });"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-registry.js","line":41},"sig":"(options)","doc":true},{"key":"PluginRegistry.register","method":"METHOD","path":"PluginRegistry.register","title":"PluginRegistry.register(plugin)","group":"PluginRegistry","description":"Добавляет плагин в каталог вручную.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"Object","name":"plugin","optional":false,"description":"Плагин с полями `name` и `install`."}]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"const registry = new PluginRegistry();\nregistry.register(StatePlugin).register(ChoicePlugin);"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-registry.js","line":67},"returns":{"type":"PluginRegistry","description":"Текущий каталог (для цепочки вызовов)."},"throws":[{"type":"Error","description":"Если у плагина нет имени или метода `install`,\nлибо плагин с таким именем уже есть."}],"sig":"(plugin)","doc":true},{"key":"PluginRegistry.resolve","method":"METHOD","path":"PluginRegistry.resolve","title":"PluginRegistry.resolve(name, version)","group":"PluginRegistry","description":"Возвращает плагин по имени. Если плагина нет среди добавленных\nвручную или уже загруженных, вызывает загрузчик.\n\nВерсия сейчас сравнивается только на точное совпадение\n(диапазоны вроде `^1.0` пока не поддерживаются).","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"string","name":"name","optional":false,"description":"Имя плагина."},{"group":null,"type":"string","name":"version","optional":true,"description":"Требуемая версия. Если не указана,\nподойдёт любая."}]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"const plugin = await registry.resolve('choice');"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-registry.js","line":110},"returns":{"type":"Promise","description":"Промис с объектом плагина."},"throws":[{"type":"Error","description":"Если имя недопустимо, плагин не найден или не\nзагрузился, имя загруженного плагина не совпадает с запрошенным\nлибо версия не совпадает с требуемой."}],"sig":"(name, version)","doc":true},{"key":"PluginRegistry.has","method":"METHOD","path":"PluginRegistry.has","title":"PluginRegistry.has(name)","group":"PluginRegistry","description":"","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"string","name":"name","optional":false,"description":"Имя плагина"}]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"if (!registry.has('noty')) {\n    registry.register(NotyPlugin);\n}"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-registry.js","line":209},"returns":{"type":"boolean","description":"Есть ли плагин среди добавленных или\nуже загруженных"},"sig":"(name)","doc":true},{"key":"PluginRegistry.list","method":"METHOD","path":"PluginRegistry.list","title":"PluginRegistry.list()","group":"PluginRegistry","description":"","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"console.log(registry.list()); // ['state', 'noty']"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugin-registry.js","line":225},"returns":{"type":"string[]","description":"Имена добавленных и уже загруженных плагинов"},"sig":"()","doc":true},{"key":"BackgroundPlugin","method":"CLASS","path":"BackgroundPlugin","title":"BackgroundPlugin","group":"Plugins","description":"Узел `background`: ставит картинку фоном страницы.\nДопустимы относительные пути, http(s) и data:image. Небезопасный\nадрес останавливает историю с ошибкой.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"{\n    id: 'bg1',\n    type: 'background',\n    image: 'assets/forest.jpg'\n}"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugins/background-plugin.js","line":15},"doc":true},{"key":"ChoicePlugin","method":"CLASS","path":"ChoicePlugin","title":"ChoicePlugin","group":"Plugins","description":"Узел `choice`: кнопки выбора с условными вариантами и переходом goto.\nЗависит от плагинов `state` и `conditions`.\n\nДля текстового сценария добавляет команду парсера:\n\n`CHOICE: Вопрос | Вариант 1 → метка1 | Вариант 2 → метка2`\n\nВместо стрелки можно писать `->`. Вариант без стрелки создаётся\nбез перехода: история просто продолжится со следующего узла.\nУсловия в текстовой записи пока не поддерживаются.\n\nПока выбор не сделан, клик по экрану историю не продолжает.\n\nПроверки проекта (через `api.validation`):\n\n- `choice.no-options` (ошибка): у узла нет `options`;\n- `choice.no-variants` (ошибка): у варианта нет `variants`;\n- `choice.unknown-variable` (предупреждение): условие ссылается\n  на переменную, которой нет в `config.state`.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"// Узел в проекте\n{\n    id: 'ask',\n    type: 'choice',\n    text: 'Куда пойдём?',\n    options: [\n        { id: 'o1', variants: [{ text: 'В подвал', goto: 'basement' }] },\n        {\n            id: 'o2',\n            variants: [{\n                text: 'Открыть дверь',\n                goto: 'door',\n                condition: { variable: 'health', operator: '>', value: 1 }\n            }]\n        }\n    ]\n}\n\n// Строка в текстовом сценарии\nCHOICE: Куда пойдём? | В подвал → basement | На улицу -> street"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugins/choice-plugin.js","line":1},"doc":true},{"key":"ConditionsPlugin","method":"CLASS","path":"ConditionsPlugin","title":"ConditionsPlugin","group":"Plugins","description":"Проверяет игровые условия.\n\nПредоставляет другим плагинам метод evaluate()\nчерез api.plugins.conditions.api.\n\nПоддерживаемые операторы:\n==, !=, >, >=, \u003c, \u003c=","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"const { evaluate } = api.plugins.conditions.api;\n\nevaluate({ variable: 'health', operator: '>=', value: 3 }, { health: 3 }); // true"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugins/conditions-plugin.js","line":1},"doc":true},{"key":"ConditionsPlugin.evaluate","method":"METHOD","path":"ConditionsPlugin.evaluate","title":"ConditionsPlugin.evaluate(condition, state)","group":"ConditionsPlugin","description":"Проверяет условие относительно переданного состояния.\n\nЕсли условие не задано, возвращает true.","since":null,"deprecated":null,"permissions":[],"params":{"header":[],"path":[],"query":[],"body":[],"param":[{"group":null,"type":"Object","name":"condition","optional":false,"description":"Условие проверки."},{"group":null,"type":"Object","name":"state","optional":false,"description":"Состояние, относительно которого\nпроверяется условие."}]},"success":[],"error":[],"examples":[{"type":"","title":"","content":"const result =\n    api.plugins.conditions.api.evaluate(\n        {\n            variable: 'health',\n            operator: '>',\n            value: 5\n        },\n        { health: 10 }\n    );"}],"successExamples":[],"errorExamples":[],"source":{"file":"plugins/conditions-plugin.js","line":25},"retu     var lines = String(text || '').split('\n');
    var para = [];
    var list = null;
    var i = 0;

    function flushPara() {
      if (para.length) box.appendChild(h('p', null, inlineLines(para)));
      para = [];
    }
    function flushList() {
      if (list) {
        box.appendChild(h(list.ordered ? 'ol' : 'ul', null, list.items.map(function (it) {
          return h('li', null, inline(it));
        })));
      }
      list = null;
    }

    while (i < lines.length) {
      var l = lines[i];
      if (/^\s*```/.test(l)) {
        flushPara(); flushList();
        var buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        box.appendChild(h('pre', { class: 'md-pre' }, h('code', null, buf.join('\n'))));
        continue;
      }
      if (!l.trim()) { flushPara(); flushList(); i++; continue; }
      var bm = l.match(/^\s*[-*]\s+(.*)$/);
      var om = l.match(/^\s*\d+[.)]\s+(.*)$/);
      if (bm || om) {
        flushPara();
        var ord = !!om;
        if (list && list.ordered !== ord) flushList();
        if (!list) list = { ordered: ord, items: [] };
        list.items.push((bm || om)[1]);
        i++;
        continue;
      }
      flushList();
      para.push(l);
      i++;
    }
    flushPara(); flushList();
    return box;
  }

  function firstLine(text) {
    var t = String(text || '').trim();
    if (!t || /^```/.test(t)) return '';
    var s = t.split(/\n\s*\n/)[0].replace(/\s*\n\s*/g, ' ').replace(/[`*]/g, '');
    return s.length > 140 ? s.slice(0, 137) + '...' : s;
  }

  function copyText(text, btn) {
    function done() {
      btn.textContent = T.copied;
      setTimeout(function () { btn.textContent = T.copy; }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
      return;
    }
    var ta = h('textarea', { style: 'position:fixed;opacity:0' });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  function statusOf(v, key) {
    if (!v.changes) return '';
    if (v.changes.added.indexOf(key) >= 0) return 'add';
    if (v.changes.changed.indexOf(key) >= 0) return 'chg';
    return '';
  }

  /* ---------- иерархия: категория -> группа (api.game) -> метод (api.game.show) ---------- */

  function prep(v) {
    if (v._p) return v._p;
    var byKey = {};
    var byPath = {};
    var kids = {};
    var parent = {};
    v.endpoints.forEach(function (e) {
      byKey[e.key] = e;
      if (e.doc) byPath[e.group + '\u0000' + e.path] = e;
    });
    v.endpoints.forEach(function (e) {
      if (!e.doc) return;
      var parts = e.path.split('.');
      for (var i = parts.length - 1; i >= 1; i--) {
        var c = byPath[e.group + '\u0000' + parts.slice(0, i).join('.')];
        if (c) {
          parent[e.key] = c.key;
          (kids[c.key] = kids[c.key] || []).push(e);
          break;
        }
      }
    });
    v._p = { byKey: byKey, kids: kids, parent: parent };
    return v._p;
  }

  function descendants(P, ep) {
    var out = [];
    (P.kids[ep.key] || []).forEach(function (k) {
      out.push(k);
      descendants(P, k).forEach(function (d) { out.push(d); });
    });
    return out;
  }

  function ancestors(P, ep) {
    var out = [];
    var p = P.parent[ep.key];
    while (p) {
      var pe = P.byKey[p];
      out.unshift(pe);
      p = P.parent[pe.key];
    }
    return out;
  }

  function dispKind(P, ep) {
    if (ep.doc && ep.method === 'PROP' && P.kids[ep.key]) return 'NS';
    return ep.method;
  }

  function labelOf(P, ep) {
    if (!ep.doc) return ep.title || ep.path;
    var p = P.parent[ep.key];
    var base = ep.path;
    if (p) base = ep.path.slice(P.byKey[p].path.length + 1);
    return base + (ep.sig || '');
  }

  function badge(kind) {
    return h('span', { class: 'method m-' + kind }, kind);
  }

  /* ---------- каркас ---------- */

  var app = document.getElementById('app');
  var nav = h('div', { class: 'nav' });
  var main = h('main', { class: 'main' });
  var select = h('select', { onchange: function () {
    var nv = byVersion(select.value);
    var k = state.key;
    if (k && k !== '~changelog' && !(nv && findEp(nv, k))) k = '';
    location.hash = hashFor(select.value, k);
  } });
  var search = h('input', { type: 'search', placeholder: T.search, oninput: function () {
    state.query = search.value.trim().toLowerCase();
    renderNav();
  } });

  versions.slice().reverse().forEach(function (v) {
    select.appendChild(h('option', { value: v.version }, T.version + ' ' + v.version + (v === latest ? ' (' + T.latest + ')' : '')));
  });

  var side = h('aside', { class: 'side' }, h('div', { class: 'brand' }, DATA.title), select, search, nav);
  var topbar = h('div', { class: 'topbar' },
    h('button', { type: 'button', onclick: function () { document.body.classList.toggle('nav-open'); } }, T.menu),
    h('strong', null, DATA.title));
  app.appendChild(topbar);
  app.appendChild(h('div', { class: 'layout' }, side, main));

  /* ---------- меню ---------- */

  function navLink(href, active, kids, title) {
    return h('a', { class: 'item' + (active ? ' active' : ''), href: href, title: title || null,
      onclick: function () { document.body.classList.remove('nav-open'); } }, kids);
  }

  function navRow(v, P, ep, flat) {
    var st = statusOf(v, ep.key);
    return navLink(hashFor(v.version, ep.key), state.key === ep.key, [
      badge(dispKind(P, ep)),
      h('span', { class: 'label' + (ep.deprecated ? ' dep' : '') }, flat ? (ep.title || ep.path) : labelOf(P, ep)),
      st ? h('span', { class: 'dot ' + st, title: st === 'add' ? T.isNew : T.isChanged }) : null
    ], ep.title || ep.path);
  }

  function navNode(v, P, ep, openSet) {
    var kids = P.kids[ep.key] || [];
    if (!kids.length) return h('div', { class: 'nnode' }, h('div', { class: 'nrow' }, h('span', { class: 'chev-sp' }), navRow(v, P, ep, false)));

    var open = expanded.hasOwnProperty(ep.key) ? expanded[ep.key] : !!openSet[ep.key];
    var chev = h('button', { class: 'chev' + (open ? ' open' : ''), type: 'button', 'aria-label': 'toggle',
      onclick: function (e) {
        e.preventDefault();
        expanded[ep.key] = !open;
        renderNav();
      } }, '▸');
    return h('div', { class: 'nnode' },
      h('div', { class: 'nrow' }, chev, navRow(v, P, ep, false)),
      open ? h('div', { class: 'nkids' }, kids.map(function (k) { return navNode(v, P, k, openSet); })) : null);
  }

  function renderNav() {
    var v = byVersion(state.version);
    nav.textContent = '';
    if (!v) return;
    var P = prep(v);

    nav.appendChild(h('div', { class: 'top' },
      navLink(hashFor(v.version, ''), !state.key, [h('span', { class: 'label' }, T.overview)]),
      navLink(hashFor(v.version, '~changelog'), state.key === '~changelog', [h('span', { class: 'label' }, T.changelog)])));

    var q = state.query;
    var groups = {};
    var order = [];
    function put(ep) {
      if (!groups[ep.group]) { groups[ep.group] = []; order.push(ep.group); }
      groups[ep.group].push(ep);
    }

    var openSet = {};
    var active = state.key && P.byKey[state.key];
    if (active) {
      openSet[active.key] = true;
      ancestors(P, active).forEach(function (a) { openSet[a.key] = true; });
    }

    if (q) {
      v.endpoints.forEach(function (ep) {
        if ((ep.title + ' ' + ep.path + ' ' + ep.method + ' ' + ep.group).toLowerCase().indexOf(q) >= 0) put(ep);
      });
    } else {
      v.endpoints.forEach(function (ep) { if (!P.parent[ep.key]) put(ep); });
    }

    if (!order.length) nav.appendChild(h('p', { class: 'muted', style: 'padding:6px 8px' }, T.noMatch));

    order.forEach(function (g) {
      var det = h('details', { open: !closedCats[g] || !!q }, h('summary', null, g));
      det.addEventListener('toggle', function () { if (!q) closedCats[g] = !det.open; });
      groups[g].forEach(function (ep) {
        det.appendChild(q ? h('div', { class: 'nnode' }, h('div', { class: 'nrow' }, navRow(v, P, ep, true))) : navNode(v, P, ep, openSet));
      });
      nav.appendChild(det);
    });
  }

  /* ---------- содержимое ---------- */

  function link(v, key, title) {
    return h('a', { href: hashFor(v.version, key) }, h('code', null, key), title && title !== key ? ' — ' + title : '');
  }

  function changeBlock(v) {
    var c = v.changes;
    if (!c) return h('p', { class: 'muted' }, T.initial + ': ' + v.endpoints.length + ' ' + T.endpoints);
    if (!c.added.length && !c.changed.length && !c.removed.length) return h('p', { class: 'muted' }, T.none);
    function list(title, cls, items) {
      if (!items.length) return null;
      return [h('h3', { class: cls }, title + ' (' + items.length + ')'),
        h('ul', { class: cls }, items.map(function (i) { return h('li', null, i); }))];
    }
    function titleOf(key) { var e = findEp(v, key); return e ? e.title : ''; }
    return h('div', { class: 'changes' },
      list(T.added, 'add', c.added.map(function (k) { return link(v, k, titleOf(k)); })),
      list(T.changed, 'chg', c.changed.map(function (k) { return link(v, k, titleOf(k)); })),
      list(T.removed, 'rem', c.removed.map(function (r) { return h('span', null, h('code', null, r.key), r.title && r.title !== r.key ? ' — ' + r.title : ''); })));
  }

  function viewOverview(v) {
    var P = prep(v);
    var root = h('div', null);
    root.appendChild(h('h1', null, DATA.title));
    root.appendChild(h('p', { class: 'muted' },
      T.version + ' ' + v.version + ' · ' + T.released + ' ' + (v.date || '') + ' · ' + v.endpoints.length + ' ' + T.endpoints));
    root.appendChild(h('h2', null, T.changelog + ' ' + v.version));
    root.appendChild(changeBlock(v));
    root.appendChild(h('h2', null, T.groups));
    var groups = {};
    var order = [];
    v.endpoints.forEach(function (ep) {
      if (P.parent[ep.key]) return;
      if (!groups[ep.group]) { groups[ep.group] = []; order.push(ep.group); }
      groups[ep.group].push(ep);
    });
    order.forEach(function (g) {
      root.appendChild(h('div', { class: 'card' }, h('strong', null, g),
        h('div', { style: 'margin-top:8px' }, groups[g].map(function (ep) {
          var sum = firstLine(ep.description);
          return h('div', { style: 'margin:5px 0' },
            badge(dispKind(P, ep)), ' ',
            h('a', { href: hashFor(v.version, ep.key) }, ep.doc ? h('code', null, ep.title) : (ep.title || ep.path)),
            ep.doc ? null : [' ', h('code', null, ep.path)],
            sum ? h('span', { class: 'muted' }, ' — ' + sum) : null);
        }))));
    });
    return root;
  }

  function viewChangelog() {
    var root = h('div', null, h('h1', null, T.changelog));
    versions.slice().reverse().forEach(function (v) {
      root.appendChild(h('h2', null, v.version, ' ', h('span', { class: 'muted', style: 'font-weight:400;font-size:13px' }, v.date || '')));
      root.appendChild(changeBlock(v));
    });
    return root;
  }

  function fieldsTable(fields, isParam) {
    return h('table', { class: 'fields' },
      h('thead', null, h('tr', null, h('th', null, T.field), h('th', null, T.type), h('th', null, T.description))),
      h('tbody', null, fields.map(function (f) {
        var depth = (f.name.match(/\./g) || []).length;
        return h('tr', null,
          h('td', null, h('span', { style: depth ? 'margin-left:' + depth * 14 + 'px' : null }, h('code', null, f.name)), ' ',
            f.optional ? h('span', { class: 'tag' }, T.optional) : (isParam ? h('span', { class: 'tag req' }, T.required) : null)),
          h('td', null, f.type ? h('code', null, f.type) : ''),
          h('td', null, rich(f.description, 'cell'),
            f['default'] !== undefined ? h('div', { class: 'muted' }, T.def + ': ', h('code', null, f['default'])) : null));
      })));
  }

  function groupBy(fields, fallback) {
    var order = [];
    var map = {};
    fields.forEach(function (f) {
      var g = f.group || fallback;
      if (!map.hasOwnProperty(g)) { map[g] = []; order.push(g); }
      map[g].push(f);
    });
    return order.map(function (g) { return { group: g, fields: map[g] }; });
  }

  function exampleBlock(ex) {
    var btn = h('button', { class: 'copy', type: 'button', onclick: function () { copyText(ex.content, btn); } }, T.copy);
    return h('div', { class: 'example' },
      h('div', { class: 'ex-head' },
        h('span', { class: 'grow' }, ex.title || ex.type || ''),
        ex.title && ex.type ? h('span', { class: 'tag' }, ex.type) : null, btn),
      h('pre', null, h('code', null, ex.content)));
  }

  function section(title, content, tag) {
    var frag = document.createDocumentFragment();
    frag.appendChild(h(tag || 'h2', null, title));
    add(frag, content);
    return frag;
  }

  function metaTags(v, ep) {
    var st = statusOf(v, ep.key);
    var tags = [];
    if (st) tags.push(h('span', { class: 'tag ' + st }, st === 'add' ? T.isNew : T.isChanged));
    if (ep.deprecated) tags.push(h('span', { class: 'tag dep' }, T.deprecated + (ep.deprecated !== true ? ': ' + ep.deprecated : '')));
    if (ep.since) tags.push(h('span', { class: 'tag' }, T.since + ' ' + ep.since));
    if (ep.type) tags.push(h('span', { class: 'tag' }, T.type + ': ' + ep.type));
    ep.permissions.forEach(function (p) { tags.push(h('span', { class: 'tag' }, T.permissions + ': ' + p)); });
    return tags.length ? h('div', { class: 'tags' }, tags) : null;
  }

  // Тело записи (без заголовка). sub — уровень подзаголовков, footer — версии и исходник.
  function endpointBody(v, ep, sub, footer) {
    var out = document.createDocumentFragment();
    add(out, metaTags(v, ep));
    if (ep.description) out.appendChild(rich(ep.description));

    ['header', 'path', 'query', 'body', 'param'].forEach(function (g) {
      if (ep.params[g] && ep.params[g].length) out.appendChild(section(T[g], fieldsTable(ep.params[g], true), sub));
    });
    if (ep.properties && ep.properties.length) out.appendChild(section(T.properties, fieldsTable(ep.properties, false), sub));

    if (ep.returns) {
      out.appendChild(section(T.returns, [
        ep.returns.type ? h('code', null, ep.returns.type) : null,
        ep.returns.description ? rich(ep.returns.description) : null
      ], sub));
    }
    if (ep.throws && ep.throws.length) {
      out.appendChild(section(T.throws, ep.throws.map(function (x) {
        return h('div', { style: 'margin:6px 0' },
          x.type ? h('code', null, x.type) : null, x.type && x.description ? ' — ' : null, inline(x.description));
      }), sub));
    }
    if (ep.examples.length) out.appendChild(section(T.examples, ep.examples.map(exampleBlock), sub));

    if (ep.success.length || ep.successExamples.length) {
      var s = [];
      groupBy(ep.success, '200').forEach(function (g) {
        s.push(h('h3', null, g.group), fieldsTable(g.fields, false));
      });
      s.push(ep.successExamples.map(exampleBlock));
      out.appendChild(section(T.success, s, sub));
    }
    if (ep.error.length || ep.errorExamples.length) {
      var er = [];
      groupBy(ep.error, '').forEach(function (g) {
        if (g.group) er.push(h('h3', null, g.group));
        er.push(fieldsTable(g.fields, false));
      });
      er.push(ep.errorExamples.map(exampleBlock));
      out.appendChild(section(T.error, er, sub));
    }

    if (footer) out.appendChild(footerBlock(v, ep, sub));
    return out;
  }

  // Версии, в которых есть запись, и ссылка на исходник
  function footerBlock(v, ep, sub) {
    var out = document.createDocumentFragment();
    var present = versions.filter(function (x) { return findEp(x, ep.key); });
    if (present.length > 1) {
      out.appendChild(section(T.presentIn, h('div', { class: 'vlist' }, present.slice().reverse().map(function (x) {
        return h('a', { class: x === v ? 'cur' : '', href: hashFor(x.version, ep.key) }, x.version);
      })), sub));
    }
    if (ep.source && ep.source.file) {
      out.appendChild(h('div', { class: 'source' }, T.source + ': ', h('code', null, ep.source.file + (ep.source.line ? ':' + ep.source.line : ''))));
    }
    return out;
  }

  function crumbs(v, P, ep) {
    var chain = ancestors(P, ep);
    var root = chain.length ? chain[0] : ep;
    var parts = root.path === ep.group ? [] : [h('span', null, ep.group), ' › '];
    chain.forEach(function (a, i) {
      if (i) parts.push(' › ');
      parts.push(h('a', { href: hashFor(v.version, a.key) }, a.path));
    });
    if (chain.length) parts.push(' › ');
    parts.push(h('strong', null, ep.path));
    return h('div', { class: 'crumbs' }, parts);
  }

  // Страница одного элемента: метод, свойство, событие или HTTP-маршрут
  function viewEndpoint(v, ep) {
    var P = prep(v);
    var root = h('article', null);
    if (ep.doc) {
      root.appendChild(crumbs(v, P, ep));
      root.appendChild(h('h1', { class: 'doc-h1' }, badge(dispKind(P, ep)), ' ', h('code', { class: 'sig' }, ep.title)));
    } else {
      root.appendChild(h('h1', null, ep.title || ep.path));
      root.appendChild(h('div', { class: 'urlbar' }, badge(ep.method), h('code', null, ep.path)));
    }
    root.appendChild(endpointBody(v, ep, 'h2', true));
    return root;
  }

  // Страница группы (например api.game): описание группы + все её члены подряд
  function viewGroup(v, ep) {
    var P = prep(v);
    var members = descendants(P, ep);
    var root = h('article', null);
    root.appendChild(crumbs(v, P, ep));
    root.appendChild(h('h1', { class: 'doc-h1' }, badge(dispKind(P, ep)), ' ', h('code', { class: 'sig' }, ep.title)));
    root.appendChild(endpointBody(v, ep, 'h2', false));

    root.appendChild(h('h2', null, T.members + ' (' + members.length + ')'));
    root.appendChild(h('table', { class: 'fields members' },
      h('thead', null, h('tr', null, h('th', null, T.name), h('th', null, T.description))),
      h('tbody', null, members.map(function (m) {
        return h('tr', null,
          h('td', null, badge(dispKind(P, m)), ' ',
            h('a', { href: hashFor(v.version, m.key) }, h('code', null, m.path + (m.sig || '')))),
          h('td', null, firstLine(m.description)));
      }))));

    members.forEach(function (m) {
      var box = h('section', { class: 'member' });
      box.appendChild(h('h2', { class: 'member-h' }, badge(dispKind(P, m)), ' ',
        h('code', { class: 'sig' }, m.title),
        h('a', { class: 'permalink', href: hashFor(v.version, m.key), title: T.open }, '↗')));
      box.appendChild(endpointBody(v, m, 'h3', false));
      root.appendChild(box);
    });

    root.appendChild(footerBlock(v, ep, 'h2'));
    return root;
  }

  function viewItem(v, ep) {
    var P = prep(v);
    return P.kids[ep.key] ? viewGroup(v, ep) : viewEndpoint(v, ep);
  }

  function renderMain() {
    var v = byVersion(state.version);
    main.textContent = '';
    if (!v) {
      main.appendChild(h('h1', null, DATA.title));
      return;
    }
    var view;
    if (state.key === '~changelog') {
      view = viewChangelog();
    } else if (state.key) {
      var ep = findEp(v, state.key);
      view = ep ? viewItem(v, ep) : h('div', null, h('h1', null, state.key), h('p', { class: 'muted' }, T.notFound),
        h('p', null, h('a', { href: hashFor(v.version, '') }, T.overview)));
    } else {
      view = viewOverview(v);
    }
    main.appendChild(view);
    window.scrollTo(0, 0);
  }

  function route() {
    var p = parseHash();
    var v = byVersion(p.version) || latest;
    state.version = v ? v.version : '';
    state.key = byVersion(p.version) ? (p.key || '') : '';
    select.value = state.version;
    document.title = DATA.title + (state.key && state.key !== '~changelog' ? ' — ' + state.key : '');
    renderNav();
    renderMain();
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
